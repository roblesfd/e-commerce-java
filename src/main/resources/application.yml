spring:
  application:
    name: e-commerce
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/shared
      - classpath:db/migration/customer
      - classpath:db/migration/catalog
      - classpath:db/migration/pricing
      - classpath:db/migration/inventory
      - classpath:db/migration/cart
      - classpath:db/migration/promotion
      - classpath:db/migration/checkout
      - classpath:db/migration/order
      - classpath:db/migration/payment
      - classpath:db/migration/shipping
      - classpath:db/migration/returns
      - classpath:db/migration/reviews
      - classpath:db/migration/wishlist
      - classpath:db/migration/notifications
      - classpath:db/migration/search
      - classpath:db/migration/admin
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

iam:
  base-url: ${IAM_BASE_URL:http://localhost:8083}

cart:
  ttl: ${CART_TTL:PT168H}

checkout:
  ttl: ${CHECKOUT_TTL:PT24H}

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:mock-secret}

shipping:
  webhook-secret: ${SHIPPING_WEBHOOK_SECRET:mock-secret}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %X{correlationId} - %msg%n"
